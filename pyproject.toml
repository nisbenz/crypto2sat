[project]
name = "crypto2sat"
version = "0.1.0"
description = "Well-known crypto problems (RSA, ECDLP, AES, DES, ChaCha20, MD5, SHA-1, SHA-256, SHA-3) as 3-CNF SAT instances"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
solve = ["python-sat"]
test = ["python-sat", "pycryptodome", "pytest"]

[project.scripts]
crypto2sat = "crypto2sat.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["crypto2sat", "crypto2sat.algos"]
